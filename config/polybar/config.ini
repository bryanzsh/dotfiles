; =====================================================================
; polybar  -  config.ini  (barra de estado ligera)
; Todos los modulos son "internos" de polybar: no lanzan procesoss
; externos ni scripts -> consumo minimo de CPU/RAM.
; =====================================================================

[colors]
bg        = #000000
fg        = #ffffff
accent    = #ffffff
border    = #1a1a1a
focusedbg = #ffffff
focusedfg = #000000
emptyfg   = #666666

; ============================== BAR  =================================
[bar/main]
; Monitor donde se dibuja la barra. Se inyecta via variable de entorno
; MONITOR desde bspwmrc (deteccion automatica con xrandr). Asi funciona
; con cualquier monitor, multi-monitor o VM.
monitor = ${env:MONITOR}

width       = 100%
height      = 26
radius      = 0
offset-y    = 0

background  = ${colors.bg}
foreground  = ${colors.fg}
line-size   = 1
line-color  = ${colors.border}
border-top-size   = 0
border-bottom-size = 1
border-bottom-color = ${colors.border}

padding-left  = 2
padding-right  = 2
module-margin = 1

; Fuente: JetBrainsMono Nerd Font (misma que kitty, mas linda). El ";2" es indice de escala.
font-0 = JetBrainsMono Nerd Font:size=10;2

; Disposicion de modulos
modules-left   = workspaces
modules-center =
modules-right  = cpu memory net vpn target date

; Sin bandeja de iconos (menos recursos y ruido visual).

warn-unknown-modules = false

; =========================== WORKSPACES ==============================
[module/workspaces]
type = internal/bspwm
; 5 escritorios como circulos: ocupados/foco rellenos de blanco (●),
; vacios sin relleno (○). Circ ● = U+25CF, Circ ○ = U+25CB (DejaVu Sans Mono).
label-focused   = ●
label-focused-foreground   = ${colors.focusedbg}
label-focused-underline    = ${colors.accent}
label-occupied  = ●
label-occupied-foreground  = ${colors.fg}
label-empty     = ○
label-empty-foreground     = ${colors.emptyfg}
label-separator  = "   "
label-padding    = 1

; ============================== CPU  =================================
[module/cpu]
type = internal/cpu
; Intervalo de muestreo en segundos (2s = casi gratis en CPU).
interval = 2
format-prefix       = "CPU:"
format-prefix-foreground = ${colors.accent}
label = %percentage%%
; el simbolo % se escapa como %%

; ============================= RAM  ==================================
[module/memory]
type = internal/memory
interval = 2
format-prefix       = "RAM:"
format-prefix-foreground = ${colors.accent}
label = %used% / %total%

; ============================= NET  ==================================
[module/net]
type = internal/network
interface = eth0
interval  = 3
format-connected     = <label-connected>
format-connected-background = ${colors.bg}
; %local_ip% = IP actual de eth0 (interno de polybar, sin scripts).
label-connected      = "IP %local_ip%"
format-disconnected  = "NET OFF"
format-disconnected-foreground = ${colors.emptyfg}

; ============================= VPN  ==================================
[module/vpn]
type = custom/script
; vpn.sh lee tun0: IP en verde si hay, "VPN disconnected" en gris si no.
exec = ~/.config/polybar/vpn.sh
interval = 3
format = <label>
label = %output%

; ============================ TARGET =================================
[module/target]
type = custom/script
; Muestra el target (IP) en rojo si settarget lo definio; "none" si no.
; Clic izquierdo copia el valor al clipboard (xclip).
exec = ~/.config/polybar/target.sh
interval = 2
click-left = sh -c 'xclip -selection clipboard -i ~/.config/polybar/target.txt'
format = <label>
label = %output%

; ============================ DATE  ==================================
[module/date]
type = internal/date
interval = 1
; El modulo necesita las claves `date` y `time` (formato strftime).
; %d dia, %m mes, %a dia de semana, %H:%M hora:minuto.
date = %d/%m/%a
time = %H:%M
label = "%date% %time%"
label-foreground = ${colors.fg}