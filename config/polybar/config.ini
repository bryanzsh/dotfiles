; =====================================================================
; polybar  -  config.ini  (barra de estado ligera)
; Todos los modulos son "internos" de polybar: no lanzan procesoss
; externos ni scripts -> consumo minimo de CPU/RAM.
; =====================================================================

[colors]
bg        = #000000
fg        = #ffffff
accent    = #ffffff
border    = #1a1a1a
focusedbg = #ffffff
focusedfg = #000000
emptyfg   = #666666

; ============================== BAR  =================================
[bar/main]
; Monitor donde se dibuja la barra. Se inyecta via variable de entorno
; MONITOR desde bspwmrc (deteccion automatica con xrandr). Asi funciona
; con cualquier monitor, multi-monitor o VM.
monitor = ${env:MONITOR}

width       = 100%
height      = 20
radius      = 0
offset-y    = 0

background  = ${colors.bg}
foreground  = ${colors.fg}
line-size   = 1
line-color  = ${colors.border}
border-top-size   = 0
border-bottom-size = 1
border-bottom-color = ${colors.border}

padding-left  = 2
padding-right  = 2
module-margin = 1

; Fuente: DejaVu Sans Mono (ya instalada). El ";2" es factor de escala.
font-0 = DejaVu Sans Mono:size=8;2

; Disposicion de modulos
modules-left   = workspaces
modules-center =
modules-right  = cpu memory net date

; Sin bandeja de iconos (menos recursos y ruido visual).

warn-unknown-modules = false

; =========================== WORKSPACES ==============================
[module/workspaces]
type = internal/bspwm
; Etiquetas en texto plano; el "resaltado" se hace por colores de fondo.
label-focused   = %name%
label-focused-background   = ${colors.focusedbg}
label-focused-foreground   = ${colors.focusedfg}
label-focused-underline    = ${colors.accent}
label-occupied   = %name%
label-occupied-foreground = ${colors.fg}
label-empty      = %name%
label-empty-foreground    = ${colors.emptyfg}
label-separator  = " "
label-padding    = 2

; ============================== CPU  =================================
[module/cpu]
type = internal/cpu
; Intervalo de muestreo en segundos (2s = casi gratis en CPU).
interval = 2
format-prefix       = "CPU:"
format-prefix-foreground = ${colors.accent}
label = %percentage%%
; el simbolo % se escapa como %%

; ============================= RAM  ==================================
[module/memory]
type = internal/memory
interval = 2
format-prefix       = "RAM:"
format-prefix-foreground = ${colors.accent}
label = %used% / %total%

; ============================= NET  ==================================
[module/net]
type = internal/network
interface = eth0
interval  = 3
format-connected     = <label-connected>
format-connected-background = ${colors.bg}
; %local_ip% = IP actual de eth0 (interno de polybar, sin scripts).
label-connected      = "IP %local_ip%  D:%downspeed% U:%upspeed%"
format-disconnected  = "NET OFF"
format-disconnected-foreground = ${colors.emptyfg}

; ============================ DATE  ==================================
[module/date]
type = internal/date
interval = 1
; El modulo necesita las claves `date` y `time` (formato strftime).
; %d dia, %m mes, %a dia de semana, %H:%M hora:minuto.
date = %d/%m/%a
time = %H:%M
label = "%date% %time%"
label-foreground = ${colors.fg}