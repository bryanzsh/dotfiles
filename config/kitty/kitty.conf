# =====================================================================
# kitty.conf  -  Config minimalista para el terminal.
# Sin temas ni plugins: lo esencial para empezar ligero.
# =====================================================================

# Tamano de la fuente (ajusta a tu resolucion/DIP).
font_size         10.0
# Fuente Nerd (iconos de lsd y glifos del prompt p10k).
# Variante no-Mono: iconos ligeramente mas grandes (recomendada por NvChad).
font_family       JetBrainsMono Nerd Font

# Cursor en forma de trazo (menos "pesado" visualmente).
cursor_shape      beam

# Transparencia ligera y dinamica.
# Con Ctrl+Shift+O puedes ajustarla en caliente.
background_opacity 0.90
dynamic_background_opacity yes

# Evita mensajes que piden confirmacion al cerrar con muchas pestañas.
confirm_os_window_close 0

# --- Navegacion entre splits (ventanas DENTRO de kitty) -----------------
# Ctrl+Shift+flechas = mover foco entre las ventanas del mismo kitty.
# (Ctrl+flechas queda reservado para cambiar ventanas de bspwm a nivel WM).
map ctrl+shift+left   neighboring_window left
map ctrl+shift+right  neighboring_window right
map ctrl+shift+up     neighboring_window up
map ctrl+shift+down   neighboring_window down

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Fondo negro total (override sobre el color de la theme) - pedido por el usuario.
background #000000

# --- Multi-clipboard con F1-F4 -------------------------------------------
# Selecciona texto con el raton y:
#   F1 copia al buffer 1 (clipboard del sistema) · F2 pega desde 1
#   F3 copia al buffer 2 (buffer privado "cb2")  · F4 pega desde 2
map f1 copy_to_buffer clipboard
map f2 paste_from_buffer clipboard
map f3 copy_to_buffer cb2
map f4 paste_from_buffer cb2
