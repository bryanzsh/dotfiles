# =====================================================================
# picom.conf  -  Compositor ligero (sombras suaves + blur moderado).
# Maquina: VM con GPU virtual (VMware SVGA II) -> SIN aceleracion HW.
#
# ENTENDIENDO LAS DECISIONES CLAVE:
#  - backend "xrender": usa el compositor 2D de X (CPU). Si usaramos
#    "egl"/"glx", picom pediria OpenGL y, al no haber GPU real, Kali
#    lo resolveria con llvmpipe (GL por software) -> consumo alto de CPU.
#  - blur "dual_kawase": desenfoca con 2 pasadas (sub-muestreo), es el
#    mas eficiente. "gaussian" o "box" son mas caros en CPU.
#  - vsync OFF: en una VM no hay tear real y el vsync por software
#    cuesta CPU. Lo desactivamos.
# =====================================================================

# --- Backend / render -------------------------------------------------
backend = "xrender"
vsync   = false

# Esquinas redondeadas (radio 12px; 0 = sin redondeo).
corner-radius = 12
round-borders = 0
# Reglas: mantener RECTOS pantalla completa, barra, docks y menus.
# corner-radius-rules tiene prioridad sobre el global (lista de strings).
corner-radius-rules = [
    "0:fullscreen",
    "0:window_type = 'dock'",
    "0:class_g = 'Polybar'",
    "0:window_type = 'popup_menu'",
    "0:window_type = 'dropdown_menu'"
];

# --- Sombras ligeras ---------------------------------------------------
shadow              = true
shadow-radius       = 8          # radio pequeno = sombra discreta
shadow-opacity      = 0.20       # muy sutil (0.75 es el default, 0.2 ahorra)
shadow-offset-x     = -2
shadow-offset-y     = -2
shadow-red          = 0.0
shadow-green        = 0.0
shadow-blue         = 0.0
shadow-ignore-shaped = true

# No dibujar sombra sobre escritorio/menus/barra (visible sin costo).
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Polybar'",
    "class_g = 'Dunst'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'tooltip'"
]

# --- Opacidad ----------------------------------------------------------
# Opacidad: enfocada 0.90 / inactiva 0.80 -> la ventana inactiva deja ver
# el fondo desenfocado. Bajar mas = mas transparente (mas blur).

active-opacity   = 0.90
inactive-opacity = 0.80
frame-opacity    = 1.0

# --- Blur (moderado / balance calidad-rendimiento) ----------------------
blur-background      = true
blur-background-frame = false      # no desenfocar bordes -> menos CPU
blur-background-fixed = false
# No gastar CPU desenfocando la barra, docks, ni ventanas flotantes de menu.
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
]

# dual_kawase = el mas ligero de los metodos de blur.
# strength 5 = suave y visible; si el rendimiento no acompaña, baja a 3
# o pon "none".
blur-method   = "dual_kawase"
blur-strength = 5

# --- Animaciones / efectos pesados: DESACTIVADOS ------------------------
# Sin fade de apertura/cierre (ahorra CPU y desconexiones de ventana).
fading  = false
fade-in-step  = 0.06
fade-out-step = 0.06

# Sin redimension animada ni transiciones de opacidad.
active-opacity-override = true

# --- Optimizaciones de rendimiento --------------------------------------
# Si una ventana a pantalla completa (ej. un video) ocupa el escritorio,
# picom deja de actuar sobre el area -> menor carga.
unredir-if-possible = true
# Refresco automatico del compositor segun ventanas dañadas.
use-damage = true

# --- Log (para diagnosticar sin mirar la pantalla) ----------------------
# Nivel "warn": solo errores importantes. Archivo de log en /tmp.
log-level  = "warn"
log-path   = "/tmp/picom.log"